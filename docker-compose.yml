version: '3.8'

services:
  # خدمة تطبيق CodeQuest (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codequest_app
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: base64:ضع_مفتاح_تطبيقك_هنا
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: codequest_db
      DB_USERNAME: codequest_user
      DB_PASSWORD: secret_password
    depends_on:
      - db
    networks:
      - codequest-network

  # خدمة قاعدة البيانات (MySQL)
  db:
    image: mysql:8.0
    container_name: codequest_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: codequest_db
      MYSQL_USER: codequest_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - codequest-network

volumes:
  db_data:

networks:
  codequest-network:
    driver: bridge